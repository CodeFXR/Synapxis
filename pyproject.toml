[build-system]
requires = ["setuptools", "wheel", "maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "synapxis"
version = "1.0.0"
description = "A Terminal-based Knowledge Graph with Rust-powered visualization."
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40.0",
    "networkx>=3.0",
    "textual-image>=0.1.0",
    "aiofiles>=23.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "aiosqlite>=0.19.0"
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "synapxis"
python-source = "src"
manifest-path = "rust_core/Cargo.toml"
